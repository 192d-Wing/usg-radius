# Only the usg-radius proxy may talk to this home server, and only with the
# proxy->home secret. The NAS never reaches FreeRADIUS directly; if it tried,
# its secret (nas-proxy-secret-1) would not verify here.
client usg-proxy {
    ipaddr = 10.77.0.20
    secret = proxy-freeradius-secret-2
    shortname = usg-proxy
    require_message_authenticator = yes
}
