# eapol_test: EAP-TEAP (RFC 9930) as teapuser@usg.test against usg-radius,
# directly and through the proxy. Phase 1 is a server-authenticated TLS 1.3
# tunnel (no client certificate; wpa_supplicant disables TLS 1.3 for TEAP by
# default, tls_disable_tlsv1_3=0 turns it back on); Phase 2 is
# Basic-Password-Auth. rustls prefers TLS_AES_256_GCM_SHA384, so this run uses
# the SHA-384 TLS-PRF and HMAC-SHA384 Compound MAC (RFC 9930 §6.2, §6.3).
# The password matches tests/interop/usg-radius/home.json.
network={
    key_mgmt=WPA-EAP
    eap=TEAP
    identity="teapuser@usg.test"
    password="teap-password-456"
    ca_cert="/certs/ca.crt"
    domain_match="usg-home"
    phase1="tls_disable_tlsv1_3=0"
}
