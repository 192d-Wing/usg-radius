# eapol_test: EAP-TLS as eaptls@usg.test with a 300-byte EAP fragment limit, so
# the supplicant splits its ClientHello and its Certificate/CertificateVerify/
# Finished flight across several EAP-TLS Responses (L+M on the first fragment,
# M on the rest). RFC 5216 §2.1.5: the server must answer each non-final
# fragment with an empty EAP-TLS Request (ACK) before the peer sends the next.
# Same identity and certificate as eap-tls-usg.conf.
network={
    key_mgmt=WPA-EAP
    eap=TLS
    identity="eaptls@usg.test"
    ca_cert="/certs/ca.crt"
    client_cert="/certs/client-usg.crt"
    private_key="/certs/client-usg.key"
    domain_match="usg-home"
    phase1="tls_disable_tlsv1_3=0"
    fragment_size=300
}
