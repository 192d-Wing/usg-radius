# eapol_test: EAP-TLS as revoked@usg.test with client-usg-revoked.crt, which the
# test CA's CRL (certs/ca.crl) revokes. usg-radius as the home server loads that
# CRL as a static file and must reject the handshake, whether the request comes
# straight from the NAS or through the usg-radius proxy.
network={
    key_mgmt=WPA-EAP
    eap=TLS
    identity="revoked@usg.test"
    ca_cert="/certs/ca.crt"
    client_cert="/certs/client-usg-revoked.crt"
    private_key="/certs/client-usg-revoked.key"
    domain_match="usg-home"
    phase1="tls_disable_tlsv1_3=0"
}
