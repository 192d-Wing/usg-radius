# eapol_test: EAP-TEAP as teapuser@usg.test with the wrong password. The
# server answers the Basic-Password-Auth-Resp with a Result TLV (Failure)
# inside the tunnel and then a cleartext EAP-Failure (RFC 9930 §3.6.6), and
# emits no key material.
network={
    key_mgmt=WPA-EAP
    eap=TEAP
    identity="teapuser@usg.test"
    password="not-the-teap-password"
    ca_cert="/certs/ca.crt"
    domain_match="usg-home"
    phase1="tls_disable_tlsv1_3=0"
}
