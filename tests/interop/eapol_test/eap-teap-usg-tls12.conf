# eapol_test: EAP-TEAP as teapuser@usg.test over TLS 1.2 (wpa_supplicant's
# default for TEAP) with an AES-128-GCM-SHA256 cipher suite forced, so the TEAP
# key schedule runs with the SHA-256 TLS-PRF and HMAC-SHA256 Compound MAC
# (RFC 9930 §6.2, §6.3) — the other hash the server must select from the
# negotiated cipher suite. Same identity and password as eap-teap-usg.conf.
network={
    key_mgmt=WPA-EAP
    eap=TEAP
    identity="teapuser@usg.test"
    password="teap-password-456"
    ca_cert="/certs/ca.crt"
    domain_match="usg-home"
    openssl_ciphers="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
}
