# eapol_test: EAP-TLS as eaptls@freeradius.test, routed by the usg-radius proxy
# to FreeRADIUS. The CN of client-freeradius.crt is this identity.
network={
    key_mgmt=WPA-EAP
    eap=TLS
    identity="eaptls@freeradius.test"
    ca_cert="/certs/ca.crt"
    client_cert="/certs/client-freeradius.crt"
    private_key="/certs/client-freeradius.key"
    domain_match="freeradius"
    phase1="tls_disable_tlsv1_3=0"
}
