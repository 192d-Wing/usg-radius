# eapol_test: EAP-TLS as eaptls@usg.test straight at usg-radius acting as the
# EAP-TLS home server (no proxy). TLS 1.3 enabled so the RFC 9190 exporter
# labels (EXPORTER_EAP_TLS_Key_Material / EXPORTER_EAP_TLS_Method-Id) are what
# both sides must agree on. The CN of client-usg.crt is this identity.
network={
    key_mgmt=WPA-EAP
    eap=TLS
    identity="eaptls@usg.test"
    ca_cert="/certs/ca.crt"
    client_cert="/certs/client-usg.crt"
    private_key="/certs/client-usg.key"
    domain_match="usg-home"
    phase1="tls_disable_tlsv1_3=0"
}
