# Interop test: usg-radius proxy and EAP-TLS home server against FreeRADIUS and
# eapol_test. Run it with tests/interop/run.sh (which generates the test PKI,
# builds, runs the checks in the `nas` container and tears down).
#
#   nas (eapol_test, radclient) 10.77.0.40
#     --[nas-proxy-secret-1]-->   usg-proxy 10.77.0.20
#                                   --[proxy-freeradius-secret-2]--> freeradius 10.77.0.10  (realm freeradius.test)
#                                   --[proxy-usghome-secret-4]-->    usg-home   10.77.0.30  (realm usg.test)
#     --[nas-usghome-secret-3]--> usg-home  10.77.0.30   (EAP-TLS with CRL checking, no proxy)
#     --[nas-usghome-secret-3]--> usg-home  10.77.0.30:1813  (Accounting-Request, Status-Server -> Accounting-Response)
#
# Fixed host numbers (.10 .20 .30 .40): the servers' client lists and the
# proxy's home-server entry are plain IPs, which keeps the configs free of DNS
# and of compose internals. The 10.77.0 prefix is the default only: run.sh
# gives every run its own project name, /24 (INTEROP_NET), test PKI
# (INTEROP_CERTS), configs rendered for that /24 (INTEROP_CONF) and image tag,
# so runs from different worktrees can share one Docker host. Nothing publishes
# a host port; the nas container reaches the servers over this network. A
# scenario that does need one should publish the container port alone
# ("1812/udp") and read the ephemeral host port back with `compose port`.
name: ${INTEROP_PROJECT:-usg-radius-interop}

networks:
  radius:
    driver: bridge
    ipam:
      config:
        - subnet: ${INTEROP_NET:-10.77.0}.0/24

services:
  freeradius:
    build: ./freeradius
    image: usg-radius-interop/freeradius:${INTEROP_PROJECT:-latest}
    networks:
      radius:
        ipv4_address: ${INTEROP_NET:-10.77.0}.10
    volumes:
      - ${INTEROP_CONF:-.}/freeradius/clients.conf:/etc/freeradius/3.0/clients.conf:ro
      - ${INTEROP_CONF:-.}/freeradius/eap:/etc/freeradius/3.0/mods-available/eap:ro
      - ${INTEROP_CONF:-.}/freeradius/authorize:/etc/freeradius/3.0/mods-config/files/authorize:ro
      - ${INTEROP_CERTS:-./certs}:/etc/freeradius/interop-certs:ro

  usg-proxy:
    build:
      context: ../..
      dockerfile: tests/interop/usg-radius/Dockerfile
      args:
        # Parallel rustc jobs inside the image build. The Dockerfile default (2)
        # suits a small Lima VM; CI exports 4 for the 4-vCPU runner.
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
    image: usg-radius-interop/usg-radius:${INTEROP_PROJECT:-latest}
    command: ["/etc/radius/proxy.json"]
    networks:
      radius:
        ipv4_address: ${INTEROP_NET:-10.77.0}.20
    volumes:
      - ${INTEROP_CONF:-.}/usg-radius/proxy.json:/etc/radius/proxy.json:ro
    depends_on:
      - freeradius

  usg-home:
    image: usg-radius-interop/usg-radius:${INTEROP_PROJECT:-latest}
    command: ["/etc/radius/home.json"]
    networks:
      radius:
        ipv4_address: ${INTEROP_NET:-10.77.0}.30
    volumes:
      - ${INTEROP_CONF:-.}/usg-radius/home.json:/etc/radius/home.json:ro
      - ${INTEROP_CERTS:-./certs}:/certs:ro
    depends_on:
      - usg-proxy

  nas:
    build: ./eapol_test
    image: usg-radius-interop/eapol_test:${INTEROP_PROJECT:-latest}
    networks:
      radius:
        ipv4_address: ${INTEROP_NET:-10.77.0}.40
    volumes:
      - ${INTEROP_CERTS:-./certs}:/certs:ro
    environment:
      FREERADIUS: ${INTEROP_NET:-10.77.0}.10
      PROXY: ${INTEROP_NET:-10.77.0}.20
      USG_HOME: ${INTEROP_NET:-10.77.0}.30
    profiles: ["test"]
    depends_on:
      - freeradius
      - usg-proxy
      - usg-home
