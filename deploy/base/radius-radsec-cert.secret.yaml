---
# RadSec (RFC 6614) TLS material, mounted at /etc/radius/radsec by the Deployment.
# The `radsec` block in radius-config.secret.yaml references these three files:
#
#   server.pem  — server certificate chain (PEM, leaf first) presented to the NAS
#   server.key  — server private key (PEM)
#   nas-ca.pem  — CA bundle used to verify NAS client certificates (mTLS)
#
# PLACEHOLDER: the values below are not valid PEM. The config is accepted by the
# binary, but the RadSec listener will fail to load these at startup until they are
# replaced. Supply real material in your overlay, e.g. with a secretGenerator from
# gitignored files (mirrors deploy/overlays/uk8w for the EAP cert):
#
#   secretGenerator:
#     - name: radius-radsec-cert
#       behavior: replace
#       files:
#         - radsec/server.pem
#         - radsec/server.key
#         - radsec/nas-ca.pem
#       options:
#         disableNameSuffixHash: true
#
# or `kubectl -n radius create secret generic radius-radsec-cert
#   --from-file=server.pem --from-file=server.key --from-file=nas-ca.pem`,
# or a SealedSecret / external secrets operator. NEVER commit a private key.
apiVersion: v1
kind: Secret
metadata:
  name: radius-radsec-cert
  namespace: radius
  labels:
    app.kubernetes.io/name: usg-radius-server
    app.kubernetes.io/part-of: usg-radius
type: Opaque
stringData:
  server.pem: "REPLACE_ME: RadSec server certificate chain (PEM, leaf first)"
  server.key: "REPLACE_ME: RadSec server private key (PEM)"
  nas-ca.pem: "REPLACE_ME: CA bundle for NAS client certificates (PEM)"
