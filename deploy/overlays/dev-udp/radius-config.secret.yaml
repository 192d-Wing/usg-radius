---
# DEV-ONLY config (strategic-merge patch over base/radius-config.secret.yaml).
# `transport: "udp-insecure"` — plain UDP, NOT FIPS-approved, spoofable. The server
# logs a prominent warning on startup. Auth on 1812/udp, accounting on 1813/udp.
apiVersion: v1
kind: Secret
metadata:
  name: radius-config
  namespace: radius
stringData:
  config.json: |
    {
      "listen_address": "::",
      "listen_port": 1812,
      "accounting_port": 1813,
      "transport": "udp-insecure",
      "secret": "CHANGE_ME_shared_radius_secret",
      "clients": [
        {
          "address": "10.0.0.0/8",
          "secret": "CHANGE_ME_shared_radius_secret",
          "name": "Dev NAS network (replace with your real client networks)",
          "enabled": true
        }
      ],
      "users": [
        {
          "username": "admin",
          "password": "CHANGE_ME_admin_password",
          "attributes": {}
        }
      ],
      "log_level": "debug",
      "audit_log_path": "/var/log/radius/audit.log",
      "accounting_log_path": "/var/log/radius/accounting.jsonl",
      "strict_rfc_compliance": true,
      "request_cache_ttl": 60,
      "request_cache_max_entries": 10000,
      "rate_limit_per_client_rps": 100,
      "rate_limit_per_client_burst": 200,
      "rate_limit_global_rps": 1000,
      "rate_limit_global_burst": 2000
    }
